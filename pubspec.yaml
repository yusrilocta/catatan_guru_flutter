name: catatan_guru
description: "Guru Asisten - Personal Management System untuk Guru"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Local Database (SQLite)
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.3
  shared_preferences: ^2.5.5

# Utilities
  intl: ^0.20.3
  uuid: ^4.4.0
  google_fonts: ^6.2.1
  shadcn_ui: ^0.57.1
  lucide_icons_flutter: ^3.1.20
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  csv: ^8.0.0
  file_picker: ^13.1.0
  share_plus: ^13.3.0
  home_widget: ^0.10.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
